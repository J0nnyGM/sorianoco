<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soriano | Acceso</title>
    <link href="../css/styles.css" rel="stylesheet">
    <link rel="icon" href="../assets/img/favicon.ico">
</head>
<body class="bg-soriano-dark h-screen w-screen overflow-hidden">

    <div class="flex w-full h-full">
        
        <div class="hidden md:flex w-1/2 bg-black relative justify-center items-center flex-col p-12 overflow-hidden border-r border-gray-900">
            <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-soriano-red/10 to-transparent z-0"></div>
            
            <div class="z-10 text-center">
                <div class="mb-8 flex justify-center">
                    <img src="../assets/img/logo.jpg" alt="Soriano Logo" class="w-48 h-48 object-contain rounded-full border-2 border-soriano-red shadow-[0_0_30px_rgba(206,32,41,0.3)]">
                </div>
                <h1 class="text-5xl font-serif text-white mb-4 tracking-wider">SORIANO</h1>
                <p class="text-gray-400 text-lg font-light tracking-widest uppercase border-t border-gray-800 pt-4 mt-4 inline-block">
                    Alta Costura & Gestión
                </p>
            </div>
            
            <div class="absolute bottom-8 text-gray-600 text-xs z-10">
                &copy; 2026 Soriano Men & Kids. Todos los derechos reservados.
            </div>
        </div>

        <div class="w-full md:w-1/2 bg-soriano-dark flex justify-center items-center p-8 relative">
            
            <div class="w-full max-w-md space-y-8">
                <div class="md:hidden text-center mb-8">
                    <img src="../assets/img/logo.jpg" alt="Soriano Logo" class="w-24 h-24 mx-auto rounded-full border border-soriano-red mb-4">
                    <h2 class="text-3xl font-serif text-white">SORIANO</h2>
                </div>

                <div class="text-left">
                    <h2 class="text-3xl font-serif text-white mb-2">Bienvenido</h2>
                    <p class="text-gray-400 text-sm">Ingresa tus credenciales para acceder al panel.</p>
                </div>

<form id="loginForm" class="mt-8 space-y-6">
                    <div class="space-y-4">
                        <div>
                            <label for="email" class="sr-only">Correo Electrónico</label>
                            <input id="email" name="email" type="email" autocomplete="email" required 
                                class="appearance-none rounded-none relative block w-full px-3 py-3 border border-gray-700 placeholder-gray-500 text-white bg-soriano-gray rounded-t-md focus:outline-none focus:ring-soriano-red focus:border-soriano-red focus:z-10 sm:text-sm transition-colors" 
                                placeholder="Correo corporativo">
                        </div>
                        <div>
                            <label for="password" class="sr-only">Contraseña</label>
                            <input id="password" name="password" type="password" autocomplete="current-password" required 
                                class="appearance-none rounded-none relative block w-full px-3 py-3 border border-gray-700 placeholder-gray-500 text-white bg-soriano-gray rounded-b-md focus:outline-none focus:ring-soriano-red focus:border-soriano-red focus:z-10 sm:text-sm transition-colors" 
                                placeholder="Contraseña">
                        </div>
                    </div>

                    <div id="errorMessage" class="hidden text-sm text-red-400 bg-red-900/20 p-3 rounded border border-red-900/50 flex items-center">
                        <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                        <span id="errorText">Error al iniciar sesión</span>
                    </div>

                    <div>
                        <button type="submit" id="loginBtn" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-soriano-red hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-soriano-red focus:ring-offset-gray-900 transition-all duration-300 shadow-lg shadow-red-900/30">
                            <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                                <svg class="h-5 w-5 text-red-300 group-hover:text-red-200 transition-colors" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                    <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
                                </svg>
                            </span>
                            Ingresar al Sistema
                        </button>
                    </div>

                    <div class="text-center mt-6 pt-4 border-t border-gray-800">
                        <p class="text-sm text-gray-500">
                            ¿Aún no tienes cuenta corporativa?
                            <a href="register.html" class="font-medium text-soriano-red hover:text-white transition-colors ml-1">
                                Solicitar Acceso
                            </a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script type="module" src="../js/auth.js"></script>
</body>
</html>
