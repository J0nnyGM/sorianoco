<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soriano | Usuarios</title>
    <link href="../css/styles.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="data:,">
</head>
<body class="bg-soriano-dark text-gray-300 font-sans antialiased">

    <div id="app-layout" class="flex h-screen overflow-hidden">
        
        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-soriano-dark p-6 md:p-12 w-full">
            
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                <div>
                    <h1 class="text-3xl font-serif text-white mb-1">Personal</h1>
                    <p class="text-gray-500 text-sm">Gestiona el acceso y roles del equipo.</p>
                </div>
                
                <div class="flex space-x-2">
                    <button id="filterAll" class="px-4 py-2 bg-gray-800 text-white text-xs rounded hover:bg-gray-700 transition active-filter ring-1 ring-gray-600">
                        Todos
                    </button>
                    <button id="filterPending" class="px-4 py-2 bg-gray-800 text-gray-400 text-xs rounded hover:bg-gray-700 transition relative">
                        Pendientes
                        <span id="badgePending" class="hidden absolute -top-1 -right-1 bg-soriano-red text-white text-[10px] w-4 h-4 flex items-center justify-center rounded-full">0</span>
                    </button>
                </div>
            </div>

            <div class="bg-black/40 border border-gray-800 rounded-lg overflow-hidden shadow-xl">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-gray-800 text-xs uppercase text-gray-500 bg-gray-900/50">
                                <th class="px-6 py-4 font-medium tracking-wider">Usuario</th>
                                <th class="px-6 py-4 font-medium tracking-wider">Rol / Dpto</th>
                                <th class="px-6 py-4 font-medium tracking-wider">Estado</th>
                                <th class="px-6 py-4 font-medium tracking-wider text-right">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody" class="divide-y divide-gray-800 text-sm">
                            <tr>
                                <td colspan="4" class="px-6 py-8 text-center text-gray-500">
                                    <i class="fas fa-circle-notch fa-spin mr-2"></i> Cargando usuarios...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <div id="actionModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-gray-900 border border-gray-700 p-6 rounded-lg max-w-sm w-full mx-4 shadow-2xl">
            <h3 class="text-lg font-serif text-white mb-2" id="modalTitle">Confirmar Acción</h3>
            <p class="text-gray-400 text-sm mb-6" id="modalDesc">¿Estás seguro?</p>
            <div class="flex justify-end space-x-3">
                <button onclick="closeModal()" class="px-4 py-2 text-gray-400 hover:text-white text-sm">Cancelar</button>
                <button id="modalConfirmBtn" class="px-4 py-2 bg-soriano-red text-white rounded text-sm hover:bg-red-700 transition">Confirmar</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initAdminLayout } from '../js/global-components.js';
        
        // 1. Iniciar Layout (Esto crea el sidebar)
        initAdminLayout('usuarios'); 

        // 2. Cargar lógica de la página (Esto busca la tabla y los filtros)
        import './usuarios.js'; 
    </script>
</body>
</html>
