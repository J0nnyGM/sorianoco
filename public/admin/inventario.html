<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soriano | Inventario</title>
    <link href="../css/styles.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="data:,">
    <style>
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-soriano-dark text-gray-300 font-sans antialiased">

    <div id="app-layout" class="flex h-screen overflow-hidden">
        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-soriano-dark p-6 md:p-12 w-full flex flex-col">
            
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-6 flex-shrink-0">
                <div>
                    <h1 class="text-3xl font-serif text-white mb-1 flex items-center gap-3">
                        <span class="bg-soriano-gold text-black w-8 h-8 rounded flex items-center justify-center text-sm"><i class="fas fa-boxes"></i></span>
                        Inventario Global
                    </h1>
                    <p class="text-gray-500 text-sm ml-11">Control de materias primas, costos y precios.</p>
                </div>
                
                <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
                    <div class="relative">
                        <select id="filterType" class="appearance-none bg-black border border-gray-700 text-white text-sm rounded-full pl-4 pr-8 py-2.5 focus:border-soriano-gold outline-none cursor-pointer hover:bg-gray-900 transition">
                            <option value="all">Todo el Inventario</option>
                            <option value="material">Materias Primas</option>
                            <option value="producto">Productos Terminados</option>
                        </select>
                        <i class="fas fa-chevron-down absolute right-3 top-3.5 text-gray-500 text-xs pointer-events-none"></i>
                    </div>

                    <div class="relative flex-1 sm:w-64">
                        <i class="fas fa-search absolute left-4 top-3 text-gray-500"></i>
                        <input type="text" id="searchInput" placeholder="Buscar ítem, SKU..." class="w-full bg-black border border-gray-700 rounded-full py-2.5 pl-10 pr-4 text-sm text-white focus:border-white outline-none transition placeholder-gray-600">
                    </div>
                    
                    <button onclick="openModal()" class="btn-primary flex items-center justify-center shadow-lg shadow-red-900/20 px-6 py-2.5 text-sm rounded-full">
                        <i class="fas fa-plus mr-2"></i> Nuevo Ítem
                    </button>
                </div>
            </div>

            <div class="bg-[#121214] border border-gray-800 rounded-xl overflow-hidden shadow-xl flex-1 flex flex-col min-h-0">
                <div class="overflow-x-auto flex-1 custom-scrollbar">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-[#18181b] text-xs uppercase text-gray-500 sticky top-0 z-10 shadow-sm">
                            <tr>
                                <th class="px-6 py-4 font-bold tracking-wider border-b border-gray-800 w-20">Img</th>
                                <th class="px-6 py-4 font-bold tracking-wider border-b border-gray-800">Descripción / SKU</th>
                                <th class="px-6 py-4 font-bold tracking-wider border-b border-gray-800">Tipo</th>
                                <th class="px-6 py-4 font-bold tracking-wider border-b border-gray-800 text-right">Stock</th>
                                <th class="px-6 py-4 font-bold tracking-wider border-b border-gray-800 text-right text-green-500">Costo</th>
                                <th class="px-6 py-4 font-bold tracking-wider border-b border-gray-800 text-right text-soriano-gold">Venta</th>
                                <th class="px-6 py-4 font-bold tracking-wider border-b border-gray-800 text-right">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryTableBody" class="divide-y divide-gray-800 text-sm">
                            <tr><td colspan="7" class="px-6 py-12 text-center text-gray-500"><i class="fas fa-circle-notch fa-spin mr-2"></i> Cargando inventario...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="bg-[#18181b] px-6 py-3 border-t border-gray-800 text-xs text-gray-500 flex justify-between">
                    <span id="itemsCount">0 ítems registrados</span>
                    <span id="inventoryValueDisplay">Valor Costo Total: $0</span>
                </div>
            </div>
        </main>
    </div>

    <div id="itemModal" class="fixed inset-0 bg-black/95 hidden items-center justify-center z-50 backdrop-blur-sm p-4">
        <div class="bg-[#121214] border border-gray-700 rounded-2xl w-full max-w-3xl shadow-2xl relative flex flex-col max-h-[90vh]">
            
            <div class="px-6 py-5 border-b border-gray-800 bg-[#18181b] rounded-t-2xl flex justify-between items-center">
                <div>
                    <h3 class="text-xl font-serif text-white flex items-center gap-2">
                        <i class="fas fa-box-open text-soriano-gold"></i> 
                        <span id="modalTitle">Nuevo Ítem</span>
                    </h3>
                </div>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-gray-800 text-gray-400 hover:text-white hover:bg-red-900 flex items-center justify-center transition">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <form id="inventoryForm" class="p-6 overflow-y-auto custom-scrollbar">
                <input type="hidden" id="itemId">
                <input type="hidden" id="currentImageUrl">

                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    
                    <div class="lg:col-span-4 space-y-4">
                        <div class="bg-black border border-gray-700 rounded-xl p-4 flex flex-col items-center justify-center text-center relative group">
                            <div class="w-32 h-32 bg-gray-800 rounded-lg overflow-hidden flex items-center justify-center border border-gray-600 mb-3 shadow-inner">
                                <img id="imagePreview" src="" class="w-full h-full object-cover hidden">
                                <i id="imageIcon" class="fas fa-camera text-3xl text-gray-600 group-hover:text-gray-400 transition"></i>
                            </div>
                            <label class="cursor-pointer">
                                <span class="bg-gray-800 hover:bg-gray-700 text-white text-xs px-3 py-1.5 rounded border border-gray-600 transition">Subir Imagen</span>
                                <input type="file" id="imageInput" accept="image/*" class="hidden">
                            </label>
                        </div>

                        <div>
                            <label class="block text-xs text-gray-400 mb-1.5 uppercase font-bold">Tipo de Ítem</label>
                            <select id="classification" class="w-full bg-black border border-gray-700 text-white text-sm rounded-lg p-2.5 focus:border-soriano-gold outline-none">
                                <option value="material">Materia Prima</option>
                                <option value="producto">Producto Terminado</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs text-gray-400 mb-1.5 uppercase font-bold">Categoría</label>
                            <select id="itemType" class="w-full bg-black border border-gray-700 text-white text-sm rounded-lg p-2.5 focus:border-soriano-gold outline-none">
                                </select>
                        </div>
                    </div>

                    <div class="lg:col-span-8 space-y-5">
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div class="col-span-2 md:col-span-1">
                                <label class="block text-xs text-gray-400 mb-1.5 uppercase font-bold">Nombre del Ítem</label>
                                <input type="text" id="itemName" required class="w-full bg-black border border-gray-700 text-white text-sm rounded-lg p-2.5 focus:border-soriano-gold outline-none placeholder-gray-600" placeholder="Ej. Lino Italiano Azul">
                            </div>
                            <div class="col-span-2 md:col-span-1">
                                <label class="block text-xs text-gray-400 mb-1.5 uppercase font-bold">SKU / Código</label>
                                <input type="text" id="itemSku" class="w-full bg-black border border-gray-700 text-white text-sm rounded-lg p-2.5 focus:border-soriano-gold outline-none placeholder-gray-600" placeholder="(Automático si vacío)">
                            </div>
                        </div>

                        <div class="bg-gray-900/50 p-4 rounded-xl border border-gray-800">
                            
                            <div id="simpleStockSection" class="grid grid-cols-3 gap-4">
                                <div>
                                    <label class="block text-xs text-gray-400 mb-1.5 uppercase font-bold">Cantidad</label>
                                    <input type="number" id="itemQty" step="0.01" min="0" class="w-full bg-black border border-gray-700 text-white text-sm rounded-lg p-2.5 text-center font-bold focus:border-white outline-none" placeholder="0">
                                </div>
                                <div>
                                    <label class="block text-xs text-gray-400 mb-1.5 uppercase font-bold">Unidad</label>
                                    <select id="itemUnit" class="w-full bg-black border border-gray-700 text-white text-sm rounded-lg p-2.5 outline-none">
                                        <option value="mts">Metros</option>
                                        <option value="pza">Piezas</option>
                                        <option value="kgs">Kilos</option>
                                        <option value="rollos">Rollos</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs text-red-400 mb-1.5 uppercase font-bold">Alerta Mínima</label>
                                    <input type="number" id="itemMin" min="0" class="w-full bg-black border border-red-900/50 text-white text-sm rounded-lg p-2.5 text-center outline-none focus:border-red-500">
                                </div>
                            </div>

                            <div id="sizesStockSection" class="hidden">
                                <div class="flex justify-between items-center mb-3 border-b border-gray-800 pb-2">
                                    <label class="text-xs text-gray-400 uppercase font-bold">Stock por Tallas</label>
                                    <span class="text-xs text-gray-500">Total: <span id="totalSizesDisplay" class="text-white font-bold">0</span> unds</span>
                                </div>
                                <div id="sizesContainer" class="grid grid-cols-4 sm:grid-cols-6 gap-3">
                                    </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs text-green-500 mb-1.5 uppercase font-bold">Costo Unitario (Interno)</label>
                                <div class="relative">
                                    <span class="absolute left-3 top-2.5 text-gray-500 pointer-events-none">$</span>
                                    <input type="text" id="itemCost" required class="w-full bg-black border border-gray-700 text-green-400 font-mono text-sm rounded-lg p-2.5 pl-7 focus:border-green-500 outline-none" placeholder="0" oninput="formatCurrencyInput(this)">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs text-soriano-gold mb-1.5 uppercase font-bold">Precio de Venta</label>
                                <div class="relative">
                                    <span class="absolute left-3 top-2.5 text-gray-500 pointer-events-none">$</span>
                                    <input type="text" id="itemPrice" required class="w-full bg-black border border-gray-700 text-soriano-gold font-mono text-sm rounded-lg p-2.5 pl-7 focus:border-soriano-gold outline-none" placeholder="0" oninput="formatCurrencyInput(this)">
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </form>

            <div class="p-5 border-t border-gray-800 bg-[#18181b] rounded-b-2xl flex justify-end gap-3">
                <button type="button" onclick="closeModal()" class="px-6 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 text-sm font-medium transition">Cancelar</button>
                <button type="button" id="saveBtn" class="btn-primary shadow-lg shadow-red-900/20 px-8 py-2.5 rounded-lg text-sm font-bold flex items-center">
                    <i class="fas fa-save mr-2"></i> Guardar Ítem
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initAdminLayout } from '../js/global-components.js';
        initAdminLayout('inventario'); 
        import './inventario.js'; 
    </script>
</body>
</html>
