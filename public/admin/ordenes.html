<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soriano | Producción</title>
    <link href="../css/styles.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="data:,">
</head>
<body class="bg-soriano-dark text-gray-300 font-sans antialiased">

    <div id="app-layout" class="flex h-screen overflow-hidden">
        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-soriano-dark p-6 md:p-12 w-full">
            
            <div class="flex flex-col gap-6 mb-8">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <h1 class="text-3xl font-serif text-white mb-1">Producción</h1>
                        <p class="text-gray-500 text-sm">Tablero de control de taller.</p>
                    </div>
                    <button onclick="openModal()" class="btn-primary flex items-center shadow-lg shadow-red-900/20">
                        <i class="fas fa-plus mr-2"></i> Nueva Orden
                    </button>
                </div>

                <div class="flex flex-col md:flex-row justify-between items-end md:items-center gap-4 border-b border-gray-800 pb-4">
                    <div class="flex space-x-2 overflow-x-auto w-full md:w-auto no-scrollbar" id="statusTabs">
                        <button onclick="filterByStatus('recibido')" class="status-tab active px-4 py-2 rounded-full text-xs font-bold uppercase transition bg-gray-800 text-white border border-gray-600" data-status="recibido">Recibido</button>
                        <button onclick="filterByStatus('en_proceso')" class="status-tab px-4 py-2 rounded-full text-xs font-bold uppercase transition text-gray-500 hover:text-white" data-status="en_proceso">En Proceso</button>
                        <button onclick="filterByStatus('procesado')" class="status-tab px-4 py-2 rounded-full text-xs font-bold uppercase transition text-gray-500 hover:text-white" data-status="procesado">Procesado</button>
                        <button onclick="filterByStatus('entregado')" class="status-tab px-4 py-2 rounded-full text-xs font-bold uppercase transition text-gray-500 hover:text-white" data-status="entregado">Entregado</button>
                    </div>
                    <div class="relative w-full md:w-64">
                        <input type="text" id="searchInput" placeholder="Buscar Cliente o # Orden..." class="w-full bg-black border border-gray-700 rounded-full py-2 px-4 pl-10 text-sm focus:border-soriano-gold outline-none text-white">
                        <i class="fas fa-search absolute left-3 top-2.5 text-gray-500"></i>
                    </div>
                </div>
            </div>

            <div class="flex flex-col h-full justify-between">
                <div class="hidden md:flex px-6 pb-2 text-[10px] uppercase text-gray-500 font-bold tracking-wider">
                    <div class="w-32">Orden</div>
                    <div class="w-1/4">Cliente</div>
                    <div class="flex-1">Detalle</div>
                    <div class="w-24 text-center">Entrega</div>
                    <div class="w-24 text-right">Saldo</div>
                    <div class="w-auto ml-auto text-right">Acciones</div>
                </div>

                <div id="ordersGrid" class="flex flex-col gap-3 mb-8">
                    <div class="col-span-full text-center py-12 text-gray-500"><i class="fas fa-circle-notch fa-spin mr-2"></i> Cargando...</div>
                </div>

                <div class="bg-gray-900 border border-gray-800 rounded-lg p-4 flex justify-between items-center" id="paginationControls">
                    <span class="text-xs text-gray-500" id="pageIndicator">Página 1</span>
                    <div class="flex space-x-2">
                        <button id="prevPageBtn" class="px-3 py-1 bg-gray-800 border border-gray-700 rounded text-gray-400 text-xs hover:text-white disabled:opacity-50"><i class="fas fa-chevron-left mr-1"></i> Anterior</button>
                        <button id="nextPageBtn" class="px-3 py-1 bg-gray-800 border border-gray-700 rounded text-gray-400 text-xs hover:text-white disabled:opacity-50">Siguiente <i class="fas fa-chevron-right ml-1"></i></button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="orderModal" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50 backdrop-blur-sm p-4 overflow-y-auto">
        <div class="bg-gray-900 border border-gray-700 rounded-lg w-full max-w-6xl shadow-2xl my-4 flex flex-col max-h-[95vh]">
            <div class="p-5 border-b border-gray-800 flex justify-between items-center bg-gray-900 rounded-t-lg flex-shrink-0">
                <div><h3 class="text-xl font-serif text-white" id="modalTitle">Nueva Orden</h3></div>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white transition"><i class="fas fa-times"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto p-6 custom-scrollbar">
                <form id="orderForm" class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                    <input type="hidden" id="orderId">
                    <div class="lg:col-span-4 space-y-6 border-r border-gray-800 pr-0 lg:pr-6">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1 uppercase font-bold text-soriano-gold">1. Cliente</label>
                            <select id="clientSelect" required class="input-soriano appearance-none mb-2"><option value="">Seleccionar...</option></select>
                            <div id="clientInfoBox" class="text-xs text-gray-500 hidden"><p><i class="fas fa-phone mr-1"></i> <span id="infoPhone">-</span></p></div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div><label class="block text-[10px] text-gray-500 uppercase">Fecha Entrega</label><input type="date" id="deadline" required class="input-soriano text-sm py-2"></div>
                            <div><label class="block text-[10px] text-gray-500 uppercase">Estado Inicial</label>
                                <select id="status" class="input-soriano text-sm py-2 appearance-none">
                                    <option value="recibido">Recibido</option><option value="en_proceso">En Proceso</option><option value="procesado">Procesado</option><option value="entregado">Entregado</option>
                                </select>
                            </div>
                        </div>
                        <div class="bg-black/20 p-4 rounded border border-gray-700/50">
                            <div class="flex justify-between items-center mb-3"><h4 class="text-xs font-bold text-white uppercase">Medidas</h4></div>
                            <div class="flex space-x-2 border-b border-gray-700 mb-3 overflow-x-auto pb-1" id="measureTabs">
                                <button type="button" onclick="showMeasureTab('chaqueta')" class="measure-tab text-[10px] uppercase px-2 py-1 text-soriano-red border-b-2 border-soriano-red font-bold">Chaqueta</button>
                                <button type="button" onclick="showMeasureTab('pantalon')" class="measure-tab text-[10px] uppercase px-2 py-1 text-gray-500 hover:text-white">Pantalón</button>
                                <button type="button" onclick="showMeasureTab('camisa')" class="measure-tab text-[10px] uppercase px-2 py-1 text-gray-500 hover:text-white">Camisa</button>
                                <button type="button" onclick="showMeasureTab('chaleco')" class="measure-tab text-[10px] uppercase px-2 py-1 text-gray-500 hover:text-white">Chaleco</button>
                            </div>
                            <div id="measuresContainer" class="grid grid-cols-2 gap-2"><p class="text-xs text-gray-500 col-span-2 text-center py-4">Seleccione cliente.</p></div>
                        </div>
                    </div>
                    <div class="lg:col-span-8 space-y-6">
                        <div class="bg-gray-800/30 p-4 rounded border border-gray-700">
                            <label class="block text-xs text-gray-400 mb-2 uppercase font-bold text-soriano-gold">2. Agregar Prendas</label>
                            <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-end">
                                <div class="md:col-span-4 relative group">
                                    <label class="block text-[10px] text-gray-500 uppercase">Buscar</label>
                                    <input type="text" id="inventorySearch" class="input-soriano text-sm py-2" placeholder="Buscar..." autocomplete="off">
                                    <input type="hidden" id="selectedInventoryId"> 
                                    <div id="inventoryList" class="hidden absolute z-50 w-full bg-gray-900 border border-gray-700 rounded shadow-xl max-h-60 overflow-y-auto mt-1 custom-scrollbar"></div>
                                </div>
                                <div class="md:col-span-4"><label class="block text-[10px] text-gray-500 uppercase">Descripción</label><input type="text" id="addItemDesc" class="input-soriano text-sm py-2"></div>
                                <div class="md:col-span-2"><label class="block text-[10px] text-gray-500 uppercase">Cant.</label><input type="number" id="addItemQty" class="input-soriano text-sm py-2 text-center" value="1"></div>
                                <div class="md:col-span-2"><label class="block text-[10px] text-gray-500 uppercase">Valor</label><input type="text" id="addItemPrice" class="input-soriano text-sm py-2 text-right" oninput="formatCurrencyInput(this)"></div>
                            </div>
                            <div id="sizeSelectorContainer" class="mt-3 hidden border-t border-gray-700 pt-2"><div id="sizeButtons" class="flex flex-wrap gap-2"></div><input type="hidden" id="selectedSize"></div>
                            <div class="grid grid-cols-12 gap-3 mt-3">
                                <div class="col-span-10"><input type="text" id="addItemNotes" class="input-soriano text-xs py-1" placeholder="Notas..."></div>
                                <div class="col-span-2"><button type="button" onclick="addItemToOrder()" class="w-full bg-gray-700 hover:bg-gray-600 text-white py-2 rounded border border-gray-600 shadow-lg">+</button></div>
                            </div>
                        </div>
                        <div class="border border-gray-800 rounded overflow-hidden min-h-[150px]">
                            <table class="w-full text-left text-sm">
                                <thead class="bg-gray-900/50 text-gray-500 uppercase text-xs"><tr><th class="p-3">Cant</th><th class="p-3">Prenda</th><th class="p-3 text-right">Total</th><th class="p-3"></th></tr></thead>
                                <tbody id="orderItemsBody" class="divide-y divide-gray-800 bg-black/20 text-gray-300"></tbody>
                                <tfoot class="bg-gray-900 font-bold text-white"><tr><td colspan="2" class="p-3 text-right">Total</td><td class="p-3 text-right text-soriano-gold text-lg" id="orderTotalDisplay">$0</td><td></td></tr></tfoot>
                            </table>
                        </div>
                        <div id="productImagePreview" class="hidden flex items-center justify-center p-2 bg-black/20 rounded mt-2"><img id="imgPreviewSrc" src="" class="h-20 w-auto object-contain rounded border border-gray-600 shadow-sm"></div>
                        <div class="bg-gray-800/30 p-4 rounded border border-gray-700 mt-4">
                            <label class="block text-xs text-gray-400 mb-2 uppercase font-bold text-green-500">Pago Inicial</label>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div><label class="block text-[10px] text-gray-500 uppercase">Abono ($)</label><input type="text" id="advancePayment" class="input-soriano text-right font-bold text-white" placeholder="$0" oninput="formatCurrencyInput(this)"></div>
                                <div><label class="block text-[10px] text-gray-500 uppercase">Cuenta</label><select id="targetAccount" class="input-soriano appearance-none"><option value="">Seleccionar...</option></select></div>
                            </div>
                        </div>
                        <div class="mt-4"><label class="block text-xs text-gray-400 mb-1 uppercase">Observaciones</label><textarea id="orderNotes" rows="2" class="input-soriano text-sm"></textarea></div>
                    </div>
                </form>
            </div>
            <div class="p-5 border-t border-gray-800 bg-gray-900 flex justify-between items-center rounded-b-lg flex-shrink-0">
                <div class="text-xs text-gray-500">* Medidas no afectan ficha original.</div>
                <div class="flex space-x-3"><button type="button" onclick="closeModal()" class="px-4 py-2 text-gray-400 hover:text-white text-sm">Cancelar</button><button type="button" onclick="saveOrder()" class="btn-primary">Generar Orden</button></div>
            </div>
        </div>
    </div>

    <div id="payModal" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-[60] backdrop-blur-sm p-4">
        <div class="bg-gray-900 border border-gray-700 rounded-lg max-w-sm w-full shadow-2xl">
            <div class="p-6 border-b border-gray-800"><h3 class="text-lg font-serif text-white">Cerrar Cuenta</h3><p class="text-xs text-gray-500" id="payModalSubtitle">Orden #...</p></div>
            <form id="payForm" class="p-6 space-y-4">
                <input type="hidden" id="payOrderId">
                <div class="bg-black/40 p-4 rounded border border-gray-700 text-center"><p class="text-xs text-gray-400 uppercase tracking-widest mb-1">Saldo Pendiente</p><p class="text-3xl font-serif text-red-500" id="payBalanceDisplay">$0</p></div>
                <div class="border-b border-gray-800 pb-4">
                    <div class="flex items-center justify-between mb-2"><label class="text-[10px] text-gray-500 uppercase">Aplicar Descuento</label><button type="button" onclick="toggleDiscount()" class="text-xs text-soriano-gold hover:underline"><i class="fas fa-tag mr-1"></i> Agregar</button></div>
                    <div id="discountContainer" class="hidden"><input type="text" id="discountInput" class="input-soriano text-right text-yellow-500" placeholder="$0" oninput="calculateFinalPayment(this)"><p class="text-[10px] text-gray-500 mt-1 text-right">Nuevo saldo: <span id="newBalancePreview" class="text-white font-bold">-</span></p></div>
                </div>
                <div><label class="block text-xs text-gray-400 mb-1 uppercase">Monto a Recibir ($)</label><input type="text" id="payAmount" required class="input-soriano text-xl font-bold text-white text-center" oninput="formatCurrencyInput(this)"></div>
                <div><label class="block text-xs text-gray-400 mb-1 uppercase">Cuenta de Ingreso</label><select id="payAccount" required class="input-soriano appearance-none border-green-900/50"><option value="">Seleccionar cuenta...</option></select></div>
                <div class="flex items-center space-x-2 pt-2 bg-gray-800/50 p-2 rounded"><input type="checkbox" id="markDelivered" class="w-4 h-4 text-green-600 bg-gray-700 border-gray-600 rounded"><label for="markDelivered" class="text-xs text-gray-300 cursor-pointer">Marcar como ENTREGADO</label></div>
                <div class="pt-2 flex justify-end space-x-2"><button type="button" onclick="closePayModal()" class="btn-outline text-xs">Cancelar</button><button type="submit" class="btn-primary w-full shadow-lg shadow-green-900/20">Confirmar</button></div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initAdminLayout } from '../js/global-components.js';
        initAdminLayout('ordenes'); 
        import './ordenes.js'; 
    </script>
</body>
</html>
