<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soriano | Proveedores</title>
    <link href="../css/styles.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="data:,">
</head>
<body class="bg-soriano-dark text-gray-300 font-sans antialiased">

    <div id="app-layout" class="flex h-screen overflow-hidden">
        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-soriano-dark p-6 md:p-12 w-full">
            
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                <div>
                    <h1 class="text-3xl font-serif text-white mb-1">Proveedores</h1>
                    <p class="text-gray-500 text-sm">Directorio de suministros y servicios externos.</p>
                </div>
                <button onclick="openModal()" class="btn-primary flex items-center shadow-lg shadow-red-900/20">
                    <i class="fas fa-plus mr-2"></i> Registrar Proveedor
                </button>
            </div>

            <div class="bg-black/40 border border-gray-800 rounded-lg overflow-hidden shadow-xl">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-gray-800 text-xs uppercase text-gray-500 bg-gray-900/50">
                                <th class="px-6 py-4 font-medium tracking-wider">Empresa / Razón Social</th>
                                <th class="px-6 py-4 font-medium tracking-wider">Contacto Comercial</th>
                                <th class="px-6 py-4 font-medium tracking-wider">Categoría</th>
                                <th class="px-6 py-4 font-medium tracking-wider text-right">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="suppliersTableBody" class="divide-y divide-gray-800 text-sm">
                            <tr>
                                <td colspan="4" class="px-6 py-8 text-center text-gray-500">
                                    <i class="fas fa-circle-notch fa-spin mr-2"></i> Cargando...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div id="supplierModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 backdrop-blur-sm p-4">
        <div class="bg-gray-900 border border-gray-700 rounded-lg max-w-lg w-full shadow-2xl">
            
            <div class="p-6 border-b border-gray-800 flex justify-between items-center">
                <h3 class="text-xl font-serif text-white" id="modalTitle">Nuevo Proveedor</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white transition"><i class="fas fa-times"></i></button>
            </div>

            <form id="supplierForm" class="p-6 space-y-4">
                <input type="hidden" id="supplierId">

                <div>
                    <label class="block text-xs text-gray-400 mb-1 uppercase">Nombre Empresa</label>
                    <input type="text" id="companyName" required class="input-soriano" placeholder="Ej. Textiles Lafayette">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1 uppercase">NIT / RUT</label>
                        <input type="text" id="companyNit" class="input-soriano" placeholder="900.123.456">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1 uppercase">Categoría</label>
                        <select id="category" class="input-soriano appearance-none">
                            <option value="telas">Telas e Insumos</option>
                            <option value="maquinaria">Maquinaria</option>
                            <option value="servicios">Servicios (Luz/Agua)</option>
                            <option value="taller">Taller Externo</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-gray-400 mb-1 uppercase">Nombre Contacto</label>
                    <input type="text" id="contactName" class="input-soriano" placeholder="Ej. Pedro Pérez (Vendedor)">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1 uppercase">Teléfono</label>
                        <input type="tel" id="contactPhone" required class="input-soriano" placeholder="+57 ...">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1 uppercase">Email</label>
                        <input type="email" id="contactEmail" class="input-soriano" placeholder="ventas@empresa.com">
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-gray-400 mb-1 uppercase">Dirección / Ubicación</label>
                    <input type="text" id="address" class="input-soriano" placeholder="Calle...">
                </div>

                <div class="pt-4 flex justify-end space-x-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-gray-400 hover:text-white text-sm">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initAdminLayout } from '../js/global-components.js';
        initAdminLayout('proveedores'); 
        import './proveedores.js'; 
    </script>
</body>
</html>
